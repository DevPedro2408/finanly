<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Finanly é um dashboard de controle financeiro pessoal para acompanhar receitas, despesas, saldo, categorias e metas."
    />
    <meta name="theme-color" content="#0f1f1a" />
    <link rel="icon" type="image/svg+xml" href="public/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Finanly — Controle financeiro pessoal</title>
    <!-- Aplica o tema salvo ANTES do React carregar, evitando o "flash" de tema errado. -->
    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('finanly:theme'));
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
